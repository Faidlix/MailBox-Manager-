<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>MailBox Manager</title>
  <meta name="description" content="MailBox Manager 多帳號信箱管理介面測試版">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23194c39'/%3E%3Cpath d='M14 20h36v26H14z' fill='%23fffefa'/%3E%3Cpath d='m14 21 18 14 18-14' fill='none' stroke='%23c9e667' stroke-width='5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/filters.css">
  <link rel="stylesheet" href="/mobile.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#inbox" aria-label="MailBox Manager 首頁"><span class="brand-mark">M</span><span>MailBox<br>Manager</span></a>
      <nav>
        <a href="#inbox" data-route="inbox" aria-label="收件匣"><span class="nav-icon" aria-hidden="true">✉</span><span class="nav-label">收件匣</span><span id="unread-badge" class="badge">0</span></a>
        <a href="#compose" data-route="compose" aria-label="撰寫郵件"><span class="nav-icon" aria-hidden="true">＋</span><span class="nav-label">寫信</span></a>
        <a href="#accounts" data-route="accounts" aria-label="信箱帳號"><span class="nav-icon" aria-hidden="true">◎</span><span class="nav-label">帳號</span></a>
        <a href="#rules" data-route="rules" aria-label="分類規則"><span class="nav-icon" aria-hidden="true">≡</span><span class="nav-label">分類</span></a>
        <a href="#help" data-route="help" aria-label="說明與免責聲明"><span class="nav-icon" aria-hidden="true">?</span><span class="nav-label">說明</span></a>
      </nav>
      <div class="privacy-note"><span>本機優先</span><small>郵件索引與登入憑證留在這台電腦</small></div>
    </aside>
    <main>
      <header class="topbar">
        <div><p class="eyebrow">PERSONAL COMMUNICATION HUB <span id="demo-label" hidden>· 介面測試版</span></p><h1 id="page-title">統一收件匣</h1></div>
        <button id="sync-button" class="primary">同步全部</button>
      </header>
      <div id="notice" role="status" aria-live="polite"></div>
      <section id="view" tabindex="-1"></section>
    </main>
  </div>
  <template id="inbox-template">
    <div class="inbox-controls card">
      <label class="search"><span>搜尋</span><input id="search-input" placeholder="主旨、寄件者或內容摘要"></label>
      <div class="filter-group" aria-labelledby="account-filter-label">
        <div class="filter-heading" id="account-filter-label">信箱帳號</div>
        <div class="filter-rail"><div id="account-filters" class="filter-scroll"></div><button class="filter-add" id="add-account" type="button" aria-label="增加信箱帳號">＋</button></div>
      </div>
      <div class="filter-group" aria-labelledby="category-filter-label">
        <div class="filter-heading" id="category-filter-label">自動分類</div>
        <div class="filter-rail"><div id="category-filters" class="filter-scroll"></div><button class="filter-add" id="add-category" type="button" aria-label="增加分類條件">＋</button></div>
      </div>
      <div class="filter-group" aria-labelledby="mail-filter-label">
        <div class="filter-heading" id="mail-filter-label">郵件類型</div>
        <div id="mail-filters" class="filter-scroll status-filters"></div>
      </div>
    </div>
    <div class="mail-layout">
      <div id="message-list" class="message-list card"></div>
      <article id="message-detail" class="message-detail card empty-state"><div><b>選擇一封郵件</b><p>郵件內容會顯示在這裡。</p></div></article>
    </div>
  </template>
  <template id="compose-template">
    <form id="compose-form" class="form-card card narrow">
      <label>寄件帳號<select name="accountId" required></select></label>
      <label>收件者<input name="to" type="email" multiple placeholder="name@example.com" required></label>
      <label>副本<input name="cc" type="email" multiple placeholder="選填，以逗號分隔"></label>
      <label>主旨<input name="subject" required></label>
      <label>內容<textarea name="text" rows="13" required></textarea></label>
      <div class="form-actions"><button type="submit" class="primary">寄出郵件</button></div>
    </form>
  </template>
  <script type="module" src="/app.js"></script>
</body>
</html>
